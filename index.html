<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Qur'on Vazifalari & Hifz Nazorati</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
--primary: #064e3b;
--primary-hover: #043c2d;
--primary-light: #059669;
--primary-soft: #ecfdf5;
--accent: #d97706;
--accent-soft: #fef3c7;
--danger: #dc2626;
--bg: #f8fafc;
--surface: #ffffff;
--text: #0f172a;
--text-muted: #64748b;
--border: #e2e8f0;
--radius: 16px;
--radius-sm: 10px;
--shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.06);
}
​* {
box-sizing: border-box;
margin: 0;
padding: 0;
font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
-webkit-tap-highlight-color: transparent;
}
​body {
background-color: var(--bg);
color: var(--text);
padding: 14px 12px 60px;
min-height: 100vh;
}
​.container {
max-width: 860px;
margin: 0 auto;
}
​.header-banner {
background: linear-gradient(135deg, #064e3b, #047857);
color: #fff;
padding: 20px 16px;
border-radius: var(--radius);
box-shadow: var(--shadow);
text-align: center;
margin-bottom: 16px;
}
​.badge-ramadan {
display: inline-block;
background: rgba(217, 119, 6, 0.3);
border: 1px solid #fbbf24;
color: #fef08a;
font-size: 0.8rem;
font-weight: 700;
padding: 4px 12px;
border-radius: 999px;
margin-bottom: 8px;
}
​.header-title {
font-size: 1.35rem;
font-weight: 800;
margin-bottom: 14px;
}
​.countdown-grid {
display: flex;
justify-content: center;
gap: 8px;
}
​.countdown-box {
background: rgba(0, 0, 0, 0.25);
padding: 8px 10px;
border-radius: 10px;
min-width: 60px;
text-align: center;
border: 1px solid rgba(255, 255, 255, 0.15);
}
​.countdown-val {
font-size: 1.3rem;
font-weight: 800;
color: #fef08a;
line-height: 1.1;
}
​.countdown-lbl {
font-size: 0.65rem;
text-transform: uppercase;
color: #a7f3d0;
font-weight: 700;
margin-top: 2px;
}
​.top-bar {
display: flex;
flex-wrap: wrap;
gap: 10px;
margin-bottom: 14px;
}
​.search-input {
flex: 1 1 200px;
padding: 10px 14px;
background: #fff;
border: 1.5px solid var(--border);
border-radius: var(--radius-sm);
font-size: 0.95rem;
outline: none;
}
​.btn {
display: inline-flex;
align-items: center;
justify-content: center;
gap: 6px;
padding: 10px 16px;
border: none;
border-radius: var(--radius-sm);
cursor: pointer;
font-weight: 700;
font-size: 0.88rem;
transition: 0.15s;
}
​.btn:active { transform: scale(0.97); }
.btn-primary { background: var(--primary); color: #fff; }
.btn-accent { background: var(--accent); color: #fff; }
.btn-danger { background: var(--danger); color: #fff; }
.btn-outline { background: #fff; color: var(--text); border: 1.5px solid var(--border); }
.btn-sm { padding: 6px 12px; font-size: 0.8rem; }
​.admin-dock {
background: var(--primary-soft);
border: 1px solid #a7f3d0;
border-radius: var(--radius-sm);
padding: 12px 14px;
margin-bottom: 14px;
display: none;
align-items: center;
justify-content: space-between;
flex-wrap: wrap;
gap: 8px;
}
​.student-card {
background: var(--surface);
border-radius: var(--radius);
border: 1px solid var(--border);
box-shadow: var(--shadow);
padding: 16px;
margin-bottom: 14px;
}
​.card-top {
display: flex;
align-items: center;
justify-content: space-between;
gap: 10px;
flex-wrap: wrap;
}
​.student-profile {
display: flex;
align-items: center;
gap: 12px;
cursor: pointer;
}
​.avatar {
width: 52px;
height: 52px;
border-radius: 50%;
background: var(--primary-soft);
color: var(--primary);
display: flex;
align-items: center;
justify-content: center;
font-weight: 800;
font-size: 1.3rem;
border: 2px solid var(--primary-light);
object-fit: cover;
flex-shrink: 0;
}
​.student-profile h3 { font-size: 1.15rem; font-weight: 800; }
.student-profile p { font-size: 0.78rem; color: var(--primary-light); font-weight: 600; }
​.progress-bar-rail {
background: #e2e8f0;
height: 9px;
border-radius: 999px;
overflow: hidden;
margin: 12px 0 8px;
}
​.progress-bar-fill {
height: 100%;
background: linear-gradient(90deg, #10b981, #059669);
border-radius: 999px;
}
​.stats-grid {
display: grid;
grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
gap: 8px;
background: #f8fafc;
border: 1px solid var(--border);
padding: 10px;
border-radius: var(--radius-sm);
margin-top: 8px;
}
​.stat-label { font-size: 0.7rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; }
.stat-val { font-size: 1rem; font-weight: 800; margin-top: 2px; }
​.revision-box {
margin-top: 10px;
background: #fffbeb;
border-left: 3.5px solid var(--accent);
border-radius: 6px;
padding: 8px 12px;
font-size: 0.85rem;
color: #92400e;
}
​.card-footer {
display: flex;
justify-content: space-between;
align-items: center;
flex-wrap: wrap;
gap: 8px;
margin-top: 12px;
padding-top: 10px;
border-top: 1px solid #f1f5f9;
}
​/* Modal */
.modal-overlay {
position: fixed;
inset: 0;
background: rgba(15, 23, 42, 0.65);
backdrop-filter: blur(3px);
display: none;
align-items: center;
justify-content: center;
padding: 14px;
z-index: 1000;
}
​.modal-card {
background: #fff;
border-radius: var(--radius);
max-width: 460px;
width: 100%;
max-height: 90vh;
overflow-y: auto;
padding: 18px;
}
​.modal-head {
display: flex;
align-items: center;
justify-content: space-between;
margin-bottom: 14px;
}
​.modal-title { font-size: 1.15rem; font-weight: 800; color: var(--primary); }
.modal-close { background: none; border: none; font-size: 1.5rem; color: var(--text-muted); cursor: pointer; }
​.form-group { margin-bottom: 12px; }
.form-label { display: block; font-size: 0.78rem; font-weight: 700; color: var(--text-muted); margin-bottom: 4px; }
.form-input {
width: 100%;
padding: 10px 12px;
border: 1.5px solid var(--border);
border-radius: 8px;
font-size: 0.95rem;
outline: none;
}
​.form-input:focus { border-color: var(--primary); }
​.table { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
.table th, .table td { padding: 8px 6px; border-bottom: 1px solid var(--border); text-align: left; }
.table th { background: #f8fafc; color: var(--text-muted); }
​.toast {
position: fixed;
bottom: 16px;
left: 50%;
transform: translateX(-50%);
background: #0f172a;
color: #fff;
padding: 10px 18px;
border-radius: 10px;
font-size: 0.88rem;
font-weight: 600;
z-index: 2000;
display: none;
}
</style>
</head>
<body>
​<div class="container">
<header class="header-banner">
<div class="badge-ramadan">🌙 Ramazon-2027 Rejasi</div>
<h1 class="header-title">Qur'on Vazifalari & Hifz Nazorati</h1>
<div class="countdown-grid">
<div class="countdown-box"><div class="countdown-val" id="cdDays">0</div><div class="countdown-lbl">Kun</div></div>
<div class="countdown-box"><div class="countdown-val" id="cdHours">0</div><div class="countdown-lbl">Soat</div></div>
<div class="countdown-box"><div class="countdown-val" id="cdMins">0</div><div class="countdown-lbl">Daqiqa</div></div>
<div class="countdown-box"><div class="countdown-val" id="cdSecs">0</div><div class="countdown-lbl">Soniya</div></div>
</div>
</header>
​<div class="top-bar">
<input type="text" id="searchInput" class="search-input" placeholder="Shogird ismini qidirish..." oninput="render()">
<button id="authBtn" class="btn btn-primary" onclick="handleAuthClick()">Ustoz Kirishi</button>
</div>
​<div id="adminDock" class="admin-dock">
<div style="font-weight: 700; color: var(--primary); font-size: 0.9rem;">🛡️ Ustoz rejimi faol</div>
<div style="display: flex; gap: 6px; flex-wrap: wrap;">
<button class="btn btn-primary btn-sm" onclick="openStudentModal()">+ Shogird qo'shish</button>
<button class="btn btn-outline btn-sm" onclick="openChangePinModal()">PIN o'zgartirish</button>
<button class="btn btn-danger btn-sm" onclick="logoutAdmin()">Chiqish</button>
</div>
</div>
​<div id="studentsList"></div>
</div>
​<!-- Ustoz Kirish Modal -->
<div id="loginModal" class="modal-overlay">
<div class="modal-card">
<div class="modal-head">
<h3 class="modal-title">Ustoz Kirishi</h3>
<button class="modal-close" onclick="closeModal('loginModal')">×</button>
</div>
<div class="form-group">
<label class="form-label">PIN-kodni kiriting:</label>
<input type="password" id="pinInput" class="form-input" placeholder="Kod..." inputmode="numeric">
</div>
<div style="display:flex; justify-content:flex-end; gap:8px;">
<button class="btn btn-outline" onclick="closeModal('loginModal')">Bekor</button>
<button class="btn btn-primary" onclick="loginAdmin()">Kirish</button>
</div>
</div>
</div>
​<!-- PIN O'zgartirish Modal -->
<div id="changePinModal" class="modal-overlay">
<div class="modal-card">
<div class="modal-head">
<h3 class="modal-title">PIN Kodni O'zgartirish</h3>
<button class="modal-close" onclick="closeModal('changePinModal')">×</button>
</div>
<div class="form-group">
<label class="form-label">Eski PIN kod</label>
<input type="password" id="oldPin" class="form-input" inputmode="numeric">
</div>
<div class="form-group">
<label class="form-label">Yangi PIN kod</label>
<input type="password" id="newPin" class="form-input" inputmode="numeric">
</div>
<div style="display:flex; justify-content:flex-end; gap:8px;">
<button class="btn btn-outline" onclick="closeModal('changePinModal')">Bekor</button>
<button class="btn btn-primary" onclick="saveNewPin()">Saqlash</button>
</div>
</div>
</div>
​<!-- Shogird Qo'shish / Tahrirlash -->
<div id="studentModal" class="modal-overlay">
<div class="modal-card">
<div class="modal-head">
<h3 class="modal-title" id="studentModalTitle">Shogird Ma'lumotlari</h3>
<button class="modal-close" onclick="closeModal('studentModal')">×</button>
</div>
<input type="hidden" id="editId">
<div class="form-group">
<label class="form-label">Ism</label>
<input type="text" id="mName" class="form-input" placeholder="Masalan: Muhammadamin">
</div>
<div class="form-group">
<label class="form-label">Jami reja (son)</label>
<input type="number" id="mTarget" class="form-input" placeholder="410">
</div>
<div class="form-group">
<label class="form-label">O'lchov birligi</label>
<input type="text" id="mUnit" class="form-input" value="bet">
</div>
<div class="form-group">
<label class="form-label">Takrorlash rejasi</label>
<input type="text" id="mRev" class="form-input" placeholder="Har kuni 1 pora takror">
</div>
<div class="form-group">
<label class="form-label">Rasm (ixtiyoriy)</label>
<input type="file" id="mPhoto" accept="image/*" class="form-input" onchange="previewPhoto(event)">
<div id="photoPrevWrap" style="display:none; text-align:center; margin-top:8px;">
<img id="photoPrev" style="width:60px; height:60px; border-radius:50%; object-fit:cover;">
</div>
</div>
<div style="display:flex; justify-content:flex-end; gap:8px;">
<button class="btn btn-outline" onclick="closeModal('studentModal')">Bekor</button>
<button class="btn btn-primary" onclick="saveStudent()">Saqlash</button>
</div>
</div>
</div>
​<!-- Kunlik Dars Kiritish (Qo'lda) -->
<div id="dailyModal" class="modal-overlay">
<div class="modal-card">
<div class="modal-head">
<h3 class="modal-title" id="dailyModalTitle">Dars & Takror Kiritish</h3>
<button class="modal-close" onclick="closeModal('dailyModal')">×</button>
</div>
<input type="hidden" id="dailyStudentId">
<div class="form-group">
<label class="form-label">Yangi o'tilgan dars miqdori (raqam)</label>
<input type="number" step="any" id="dAdded" class="form-input" placeholder="Masalan: 2 yoki 1.5">
</div>
<div class="form-group">
<label class="form-label">Takrorlangan qism (matn ko'rinishida)</label>
<input type="text" id="dRev" class="form-input" placeholder="Masalan: 1-pora qaytarildi">
</div>
<div class="form-group">
<label class="form-label">Qo'shimcha izoh</label>
<input type="text" id="dNote" class="form-input" placeholder="Yaxshi o'qidi...">
</div>
<div style="display:flex; justify-content:flex-end; gap:8px;">
<button class="btn btn-outline" onclick="closeModal('dailyModal')">Bekor</button>
<button class="btn btn-accent" onclick="saveDaily()">Saqlash</button>
</div>
</div>
</div>
​<!-- Tarix Modal -->
<div id="historyModal" class="modal-overlay">
<div class="modal-card" style="max-width:560px;">
<div class="modal-head">
<h3 class="modal-title" id="histTitle">O'zlashtirish Tarixi</h3>
<button class="modal-close" onclick="closeModal('historyModal')">×</button>
</div>
<div id="histBody"></div>
<div style="display:flex; justify-content:flex-end; margin-top:12px;">
<button class="btn btn-outline" onclick="closeModal('historyModal')">Yopish</button>
</div>
</div>
</div>
​<div id="toast" class="toast"></div>
​<script>
const RAMADAN_DATE = new Date("2027-02-08T00:00:00").getTime();
const K_DATA = "quran_app_students_v6";
const K_PIN = "quran_app_pin_v6";
const K_AUTH = "quran_app_auth_v6";
​let isAdmin = localStorage.getItem(K_AUTH) === "true";
let tempPhoto = "";
​function getPin() { return localStorage.getItem(K_PIN) || "1234"; }
​function getData() {
try {
const d = JSON.parse(localStorage.getItem(K_DATA));
if (Array.isArray(d) && d.length > 0) return d;
} catch(e){}
const initial = [{
id: "s1",
name: "Muhammadamin",
target: 410,
completed: 0,
unit: "bet",
revision: "Har kuni yarim poradan takror",
photo: "",
history: []
}];
localStorage.setItem(K_DATA, JSON.stringify(initial));
return initial;
}
​function saveData(list) {
localStorage.setItem(K_DATA, JSON.stringify(list));
render();
}
​function showToast(msg) {
const t = document.getElementById("toast");
t.innerText = msg;
t.style.display = "block";
setTimeout(() => { t.style.display = "none"; }, 2500);
}
​function updateTimer() {
const diff = RAMADAN_DATE - Date.now();
const d = Math.max(0, Math.floor(diff / (1000 * 60 * 60 * 24)));
const h = Math.max(0, Math.floor((diff / (1000 * 60 * 60)) % 24));
const m = Math.max(0, Math.floor((diff / (1000 * 60)) % 60));
const s = Math.max(0, Math.floor((diff / 1000) % 60));
​document.getElementById("cdDays").innerText = d;
document.getElementById("cdHours").innerText = h;
document.getElementById("cdMins").innerText = m;
document.getElementById("cdSecs").innerText = s;
return d > 0 ? d : 1;
}
​function handleAuthClick() {
if (isAdmin) {
logoutAdmin();
} else {
document.getElementById("pinInput").value = "";
openModal("loginModal");
}
}
​function loginAdmin() {
if (document.getElementById("pinInput").value.trim() === getPin()) {
isAdmin = true;
localStorage.setItem(K_AUTH, "true");
closeModal("loginModal");
syncAdmin();
showToast("Xush kelibsiz, Ustoz!");
} else {
showToast("Noto'g'ri PIN kod!");
}
}
​function logoutAdmin() {
isAdmin = false;
localStorage.removeItem(K_AUTH);
syncAdmin();
showToast("Ustoz rejimidan chiqildi.");
}
​function syncAdmin() {
document.getElementById("authBtn").innerText = isAdmin ? "Chiqish" : "Ustoz Kirishi";
document.getElementById("authBtn").className = isAdmin ? "btn btn-danger" : "btn btn-primary";
document.getElementById("adminDock").style.display = isAdmin ? "flex" : "none";
render();
}
​function openChangePinModal() {
document.getElementById("oldPin").value = "";
document.getElementById("newPin").value = "";
openModal("changePinModal");
}
​function saveNewPin() {
const o = document.getElementById("oldPin").value.trim();
const n = document.getElementById("newPin").value.trim();
if (o !== getPin()) return showToast("Eski PIN noto'g'ri!");
if (n.length < 4) return showToast("Yangi PIN kamida 4 belgidan iborat bo'lsin!");
localStorage.setItem(K_PIN, n);
closeModal("changePinModal");
showToast("PIN kod muvaffaqiyatli o'zgartirildi!");
}
​function previewPhoto(e) {
const file = e.target.files[0];
if (!file) return;
const reader = new FileReader();
reader.onload = function(evt) {
const img = new Image();
img.onload = function() {
const canvas = document.createElement("canvas");
const MAX = 140;
let w = img.width, h = img.height;
if (w > h) { if (w > MAX) { h *= MAX/w; w = MAX; } }
else { if (h > MAX) { w *= MAX/h; h = MAX; } }
canvas.width = w; canvas.height = h;
canvas.getContext("2d").drawImage(img, 0, 0, w, h);
tempPhoto = canvas.toDataURL("image/jpeg", 0.8);
document.getElementById("photoPrev").src = tempPhoto;
document.getElementById("photoPrevWrap").style.display = "block";
};
img.src = evt.target.result;
};
reader.readAsDataURL(file);
}
​function openStudentModal(id = null) {
tempPhoto = "";
document.getElementById("mPhoto").value = "";
document.getElementById("photoPrevWrap").style.display = "none";
if (id) {
const s = getData().find(x => x.id === id);
if (!s) return;
document.getElementById("studentModalTitle").innerText = "Tahrirlash: " + s.name;
document.getElementById("editId").value = s.id;
document.getElementById("mName").value = s.name;
document.getElementById("mTarget").value = s.target;
document.getElementById("mUnit").value = s.unit || "bet";
document.getElementById("mRev").value = s.revision || "";
if (s.photo) {
tempPhoto = s.photo;
document.getElementById("photoPrev").src = s.photo;
document.getElementById("photoPrevWrap").style.display = "block";
}
} else {
document.getElementById("studentModalTitle").innerText = "Yangi Shogird";
document.getElementById("editId").value = "";
document.getElementById("mName").value = "";
document.getElementById("mTarget").value = "";
document.getElementById("mUnit").value = "bet";
document.getElementById("mRev").value = "";
}
openModal("studentModal");
}
​function saveStudent() {
const id = document.getElementById("editId").value;
const name = document.getElementById("mName").value.trim();
const target = parseFloat(document.getElementById("mTarget").value);
const unit = document.getElementById("mUnit").value.trim() || "bet";
const revision = document.getElementById("mRev").value.trim();
​if (!name || isNaN(target) || target <= 0) {
return showToast("Ism va umumiy rejani to'g'ri kiriting!");
}
​let list = getData();
if (id) {
list = list.map(s => s.id === id ? { ...s, name, target, unit, revision, photo: tempPhoto || s.photo } : s);
showToast("Yangilandi!");
} else {
list.push({ id: "s_" + Date.now(), name, target, completed: 0, unit, revision, photo: tempPhoto, history: [] });
showToast("Qo'shildi!");
}
saveData(list);
closeModal("studentModal");
}
​function removeStudent(id, name) {
if (confirm(Haqiqatdan ham "${name}" shogirdini o'chirmoqchimisiz?)) {
saveData(getData().filter(s => s.id !== id));
showToast("O'chirildi!");
}
}
​function openDailyModal(id) {
const s = getData().find(x => x.id === id);
if (!s) return;
document.getElementById("dailyStudentId").value = s.id;
document.getElementById("dailyModalTitle").innerText = s.name + " - Kunlik Dars";
document.getElementById("dAdded").value = "";
document.getElementById("dRev").value = "";
document.getElementById("dNote").value = "";
openModal("dailyModal");
}
​function saveDaily() {
const id = document.getElementById("dailyStudentId").value;
const added = parseFloat(document.getElementById("dAdded").value) || 0;
const rev = document.getElementById("dRev").value.trim();
const note = document.getElementById("dNote").value.trim();
​if (added === 0 && !rev) {
return showToast("Dars miqdori yoki takror matnini kiriting!");
}
​let list = getData();
list = list.map(s => {
if (s.id === id) {
const newDone = Number((s.completed + added).toFixed(2));
const now = new Date();
const dateStr = now.toLocaleDateString("uz-UZ") + " " + now.toLocaleTimeString("uz-UZ", {hour:"2-digit", minute:"2-digit"});
const history = s.history || [];
history.unshift({ date: dateStr, added, rev: rev || "-", note: note || "-", total: newDone });
return { ...s, completed: newDone, revision: rev || s.revision, history };
}
return s;
});
​saveData(list);
closeModal("dailyModal");
showToast("Saqlandi!");
}
​function showHistory(id) {
const s = getData().find(x => x.id === id);
if (!s) return;
document.getElementById("histTitle").innerText = s.name + " — Tarix";
const body = document.getElementById("histBody");
if (!s.history || s.history.length === 0) {
body.innerHTML = "<div style='text-align:center; color:var(--text-muted); padding:20px;'>Hozircha darslar yozilmagan.</div>";
} else {
const rows = s.history.map(h => <tr> <td><strong>${h.date}</strong></td> <td style="color:var(--primary-light); font-weight:700;">+${h.added} ${s.unit}</td> <td>${h.rev}</td> <td>${h.note}</td> </tr>).join("");
body.innerHTML = <div style="max-height:300px; overflow-y:auto;"> <table class="table"> <thead><tr><th>Sana</th><th>Dars</th><th>Takror</th><th>Izoh</th></tr></thead> <tbody>${rows}</tbody> </table> </div>;
}
openModal("historyModal");
}
​function openModal(id) { document.getElementById(id).style.display = "flex"; }
function closeModal(id) { document.getElementById(id).style.display = "none"; }
​function render() {
const listWrap = document.getElementById("studentsList");
const query = document.getElementById("searchInput").value.toLowerCase().trim();
const daysLeft = updateTimer();
let list = getData();
​if (query) list = list.filter(s => s.name.toLowerCase().includes(query));
​if (list.length === 0) {
listWrap.innerHTML = "<div style='text-align:center; padding:30px; background:#fff; border-radius:12px;'>Shogird topilmadi.</div>";
return;
}
​listWrap.innerHTML = list.map(s => {
const remaining = Math.max(0, s.target - s.completed);
const norm = (remaining / daysLeft).toFixed(2);
const pct = Math.min(100, (s.completed / s.target) * 100).toFixed(1);
const avatar = s.photo
? <img src="${s.photo}" class="avatar">
: <div class="avatar">${s.name.charAt(0).toUpperCase()}</div>;
​return <div class="student-card"> <div class="card-top"> <div class="student-profile" onclick="showHistory('${s.id}')"> ${avatar} <div> <h3>${s.name}</h3> <p>📊 Tarixni ko'rish</p> </div> </div> ${isAdmin ?
<div>
<button class="btn btn-outline btn-sm" onclick="openStudentModal('${s.id}')">Tahrirlash</button>
<button class="btn btn-danger btn-sm" onclick="removeStudent('${s.id}', '${s.name}')">O'chirish</button>
</div>
` : ""}
</div>
​<div class="progress-bar-rail">
<div class="progress-bar-fill" style="width: ${pct}%;"></div>
</div>
​<div class="stats-grid">
<div><div class="stat-label">Reja:</div><div class="stat-val">{s.target} ${s.unit}</div></div>
<div><div class="stat-label">O'qildi:</div><div class="stat-val" style="color:var(--primary-light);">${s.completed} ${s.unit}</div></div>
<div><div class="stat-label">Qoldi:</div><div class="stat-val">${remaining.toFixed(1)} ${s.unit}</div></div>
<div><div class="stat-label">Kunlik me'yor:</div><div class="stat-val" style="color:var(--accent);">${norm} / kun</div></div>
<div><div class="stat-label">Bajarildi:</div><div class="stat-val">{pct}%</div></div>
</div>
​${s.revision ? <div class="revision-box">🔄 <strong>Takror:</strong> ${s.revision}</div> : ""}
​<div class="card-footer">
<button class="btn btn-outline btn-sm" onclick="showHistory('${s.id}')">Hisobot</button>
${isAdmin ? <button class="btn btn-accent btn-sm" onclick="openDailyModal('${s.id}')">✍️ Dars & Takror kiritish</button> : ""}
</div>
</div>
`;
}).join("");
}
​window.onload = function() {
updateTimer();
setInterval(updateTimer, 1000);
syncAdmin();
};
</script>
</body>
</html>
